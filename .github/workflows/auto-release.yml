name: Auto Build & Release

on:
  push:
    branches: [ "main" ] # Agar tera branch 'master' hai toh yahan master likh dena

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # NAYA STEP: Ye Gradle ko install karega
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    # NAYA STEP: Ye missing gradlew file ko khud generate karega
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: "Auto-generated release for build ${{ github.run_number }}."
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
