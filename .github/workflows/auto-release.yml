name: Auto Build & Release

on:
  push:
    branches: [ "main" ] # Agar branch 'master' hai toh yahan master kar dena

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Gradle 8.5 ko setup karega
    - name: Setup Gradle 8.5
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.5

    # NAYA FIX: 'gradlew' ki jagah direct 'gradle' command use karenge
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: "Auto-generated release for build ${{ github.run_number }}."
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
