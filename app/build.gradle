plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GITHUB AUTO-VERSIONING LOGIC
def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def buildNum = githubRunNumber != null ? githubRunNumber.toInteger() : 1

android {
    namespace 'com.example.proguide'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.proguide"
        minSdk 24
        targetSdk 34
        
        // AUTO VERSIONING
        versionCode buildNum
        versionName "1.0.${buildNum}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // MapLibre SDK
    implementation 'org.maplibre.gl:android-sdk:11.13.5'

    // Location services
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // NAYA: Nearby Connections for P2P SOS
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'

    // Basic Android dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
